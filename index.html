<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2a6b">
  <title>TubeKids — הסרטונים שלי</title>
  <meta name="description" content="ספריית סרטונים מקומית, משפחתית ופשוטה לילדים">
  <link rel="icon" href="assets/tubekids-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Suez+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="tubekids-logo.js"></script>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-label="TubeKids נטען">
    <div class="splash-sky" aria-hidden="true">
      <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
      <i class="bubble u1"></i><i class="bubble u2"></i><i class="bubble u3"></i><i class="bubble u4"></i><i class="bubble u5"></i>
      <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><i class="spark s6"></i>
    </div>
    <div class="splash-core">
      <tubekids-logo size="xl" class="tk-logo" aria-label="TubeKids"></tubekids-logo>
      <!-- <p class="splash-tagline">סרטונים בטוחים, רק בשבילך</p> -->
      <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>
  <div class="ambient-sky" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
    <i class="bubble u1"></i><i class="bubble u2"></i><i class="bubble u3"></i><i class="bubble u4"></i><i class="bubble u5"></i>
    <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><i class="spark s6"></i>
  </div>
  <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6c0-.9 1-1.5 1.8-1L18 9.7c.8.5.8 1.6 0 2.1L9.8 17c-.8.5-1.8-.1-1.8-1V5.6Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5h2.2v14H8.5zM13.3 5h2.2v14h-2.2z" fill="currentColor"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4.5 9.5h3l4-3.5v12l-4-3.5h-3z" fill="currentColor"/><path d="M15 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4.5 9.5h3l4-3.5v12l-4-3.5h-3z" fill="currentColor"/><path d="M15 9.5l4 5M19 9.5l-4 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.5 5 5.5.8-4 3.9.95 5.5L12 16.2l-4.95 2.6.95-5.5-4-3.9 5.5-.8 2.5-5Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="M12 3.6l2.5 5 5.5.8-4 3.9.95 5.5L12 16.2l-4.95 2.6.95-5.5-4-3.9 5.5-.8 2.5-5Z" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 10.5V8a4 4 0 0 1 7.6-1.7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M19 3.5V7h-3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M15.8 15.8 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M4 9h5V4M20 9h-5V4M20 15h-5v5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron-start" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron-end" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M15.5 4.8l3.7 3.7-9.4 9.4-4.5.8.8-4.5 9.4-9.4Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.5 5.5v13M15.5 5.5v13M3.5 12h17" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5h5l2 2h10v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-11Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <tubekids-logo size="sm" class="tk-logo brand-logo" aria-label="TubeKids"></tubekids-logo>
      <label id="searchBox" class="search-box" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" placeholder="חיפוש סרטון..." autocomplete="off" aria-label="חיפוש סרטון">
      </label>
      <div class="header-actions">
        <button id="refreshButton" class="button button-quiet parent-only" hidden type="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>רענון</button>
        <button id="lockButton" class="button button-quiet" type="button" aria-label="כניסה למצב הורים" title="מצב הורים">
          <svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg>
          <span id="parentBadge" class="lock-label">מצב הורים</span>
        </button>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <section id="toolbar" class="toolbar" hidden>
      <div id="categoryChips" class="chips" role="group" aria-label="סינון לפי קטגוריה"></div>
    </section>

    <section id="storageNotice" class="storage-notice parent-only" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg>
      <span id="storageDot" class="status-dot"></span>
      <span id="storageText">קורא את תיקיית הסרטונים…</span>
    </section>

    <section id="videoGrid" class="video-grid" aria-live="polite" aria-label="ספריית הסרטונים"></section>

    <section id="emptyState" class="empty-state" hidden>
      <div class="empty-illustration" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="#i-film"></use></svg></div>
      <h1 id="emptyTitle">עוד מעט יהיו כאן סרטונים</h1>
      <p id="emptyText">בקשו מהורה להוסיף סרטון אהוב.</p>
    </section>
  </main>

  <section id="playerOverlay" class="player-overlay" hidden aria-label="נגן וידאו">
    <div class="ambient-sky player-ambient" aria-hidden="true">
      <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
      <i class="bubble u1"></i><i class="bubble u2"></i><i class="bubble u3"></i><i class="bubble u4"></i><i class="bubble u5"></i>
      <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i><i class="spark s6"></i>
    </div>
    <header class="player-header">
      <button id="closePlayer" class="button button-quiet" type="button"><svg class="icon" aria-hidden="true"><use href="#i-chevron-end"></use></svg>חזרה</button>
      <div class="player-title">
        <strong id="playingTitle"></strong>
        <small id="playingCategory"></small>
      </div>
      <button id="favoritePlaying" class="button button-quiet favorite-playing" type="button" aria-label="הוספה למועדפים" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#i-star"></use></svg>
        <span>מועדף</span>
      </button>
    </header>

    <div class="player-main">
      <div class="player-stage-column">
        <div id="playerStage" class="player-stage">
          <div id="playerFrameWrap" class="player-frame-wrap"></div>
          <div id="stageFeedback" class="stage-feedback" aria-hidden="true"><svg class="icon"><use href="#i-play"></use></svg></div>
          <button id="stageFullscreen" class="stage-fs" type="button" aria-label="מסך מלא" title="מסך מלא (F)"><svg class="icon" aria-hidden="true"><use href="#i-expand"></use></svg></button>
        </div>

        <div id="upNextCard" class="up-next-card" hidden>
          <img id="upNextThumb" class="up-next-thumb" alt="">
          <div class="up-next-text">
            <p id="upNextKicker" class="up-next-kicker">הסרטון הבא</p>
            <strong id="upNextTitle"></strong>
            <div id="upNextProgress" class="up-next-progress" aria-hidden="true"><i></i></div>
          </div>
          <div class="up-next-actions">
            <button id="upNextPlay" class="button button-red" type="button"><svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg>נגן עכשיו</button>
            <button id="upNextCancel" class="button button-ghost" type="button">לא עכשיו</button>
          </div>
        </div>

        <nav class="player-nav" aria-label="פקדי נגן">
          <button id="nextButton" class="nav-action" type="button"><svg class="icon" aria-hidden="true"><use href="#i-chevron-start"></use></svg>הבא</button>
          <button id="previousButton" class="nav-action" type="button"><svg class="icon" aria-hidden="true"><use href="#i-chevron-end"></use></svg>הקודם</button>
          <span class="nav-gap"></span>
          <label class="switch" title="בסוף כל סרטון הבא יופעל לבד">
            <input id="autoplayToggle" type="checkbox">
            <span class="switch-track" aria-hidden="true"></span>
            <span class="switch-label">הפעלה אוטומטית</span>
          </label>
          <button id="fullscreenButton" class="nav-action" type="button" aria-label="מסך מלא" title="מסך מלא"><svg class="icon" aria-hidden="true"><use href="#i-expand"></use></svg><span>מסך מלא</span></button>
        </nav>
      </div>

      <aside id="playerSidebar" class="player-sidebar" aria-label="סרטונים נוספים">
        <h2>עוד סרטונים</h2>
        <div id="sidebarList" class="sidebar-list"></div>
      </aside>
    </div>
  </section>

  <dialog id="parentDialog" class="modal">
    <form id="parentForm" method="dialog">
      <button class="modal-close" type="button" data-close="parentDialog" aria-label="סגירה"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
      <div class="modal-icon"><svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg></div>
      <h2>כניסה למצב הורים</h2>
      <p>הקלידו את הקוד כדי לנהל את הספרייה.</p>
      <label>קוד הורים<input id="pinInput" type="password" inputmode="numeric" maxlength="12" autocomplete="off" required></label>
      <p id="pinError" class="form-error" hidden>הקוד אינו נכון</p>
      <button class="button button-primary full" value="default">כניסה</button>
    </form>
  </dialog>

  <dialog id="editDialog" class="modal wide">
    <form id="editForm">
      <button class="modal-close" type="button" data-close="editDialog" aria-label="סגירה"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
      <div class="modal-icon sky"><svg class="icon" aria-hidden="true"><use href="#i-edit"></use></svg></div>
      <h2>עריכת הסרטון</h2>
      <p id="editVideoTitle"></p>
      <datalist id="categoryOptions"></datalist>
      <div class="field-row">
        <label>קטגוריה<input id="editCategoryInput" type="text" list="categoryOptions"></label>
        <label>תגיות <small>(מופרדות בפסיקים)</small><input id="editTagsInput" type="text" placeholder="חיות, שירים, עברית"></label>
      </div>
      <button class="button button-primary full" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>שמירת שינויים</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
